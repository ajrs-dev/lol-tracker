name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No RIOT_API_KEY needed: prerendered pages only fetch from the public
      # ddragon CDN; summoner pages render a setup state when the key is absent.
      - run: npm run build
